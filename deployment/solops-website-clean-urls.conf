# Insert in the solops.cloud / www.solops.cloud server block only.
# The existing /api proxy remains unchanged.


    # Public website canonical URLs. Kept inside the main website server only.
    location = / { try_files /index.html =404; }
    location = /index.html { return 301 /$is_args$args; }
    location = /how-it-works.html { return 301 /how-it-works$is_args$args; }
    location = /start-trial.html { return 301 /start-trial$is_args$args; }
    location = /downloads.html { return 301 /downloads$is_args$args; }
    location = /privacy.html { return 301 /privacy-policy$is_args$args; }
    location = /privacy-policy.html { return 301 /privacy-policy$is_args$args; }
    location = /privacy { return 301 /privacy-policy$is_args$args; }
    location = /terms.html { return 301 /terms-and-conditions$is_args$args; }
    location = /terms-and-conditions.html { return 301 /terms-and-conditions$is_args$args; }
    location = /terms { return 301 /terms-and-conditions$is_args$args; }
    location ~ ^/(how-it-works|start-trial|downloads|privacy-policy|terms-and-conditions)/$ {
        return 301 /$1$is_args$args;
    }

location / {
    try_files $uri $uri/ $uri.html =404;
}
