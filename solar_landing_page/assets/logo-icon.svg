      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#F36B16"/>
      <stop offset="100%" stop-color="#D9480F"/>
    </linearGradient>
    <linearGradient id="solopsBeam" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
